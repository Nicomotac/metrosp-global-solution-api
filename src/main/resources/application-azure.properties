# Perfil alternativo para Azure Web App + Oracle remoto.
# O perfil recomendado é oracle; este alias evita usar o driver SQL Server por engano.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
