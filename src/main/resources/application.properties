# Perfil local: H2 + Flyway sem credenciais Oracle.
# Em Azure Web App usar SPRING_PROFILES_ACTIVE=oracle e um schema Oracle compatível.
spring.application.name=metrosp-api
spring.profiles.default=local
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# JWT: segredo local no perfil local; fora dele obrigatorio via variavel.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=metrosp-api
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# RabbitMQ e' o unico componente distribuido; criar o broker antes.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:metrosp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=2
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info

# Spring AI: segredo só em ambiente, modelo simples para demonstração da GS.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
